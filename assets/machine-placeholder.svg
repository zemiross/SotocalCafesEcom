<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Placeholder for asset A1 (brief §15): unbranded single-group Italian-style espresso machine.
       Single-spout portafilter; spout tip at exactly x = 600 (50%), y = 870 (58%). Drip tray out of frame
       (the body fades out below). Light from the upper left. Original vector work, no logos. -->
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a2d29"/>
      <stop offset=".07" stop-color="#a39389"/>
      <stop offset=".2" stop-color="#f6eee2"/>
      <stop offset=".33" stop-color="#bcaea2"/>
      <stop offset=".52" stop-color="#6b5d56"/>
      <stop offset=".68" stop-color="#ddd3c6"/>
      <stop offset=".86" stop-color="#8c7e75"/>
      <stop offset="1" stop-color="#2c221f"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset=".45" stop-color="#b3a69b"/>
      <stop offset="1" stop-color="#4c3f3a"/>
    </linearGradient>
    <linearGradient id="matte" x1="0" x2="1">
      <stop offset="0" stop-color="#2b201c"/>
      <stop offset=".18" stop-color="#3a2c27"/>
      <stop offset=".5" stop-color="#1c1411"/>
      <stop offset="1" stop-color="#0c0807"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3a34"/>
      <stop offset=".35" stop-color="#1d1512"/>
      <stop offset="1" stop-color="#0b0706"/>
    </linearGradient>
    <radialGradient id="gauge" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fff9ec"/>
      <stop offset="1" stop-color="#e6dac6"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".7" stop-color="#fff"/>
      <stop offset=".93" stop-color="#000"/>
    </linearGradient>
    <mask id="bodyFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1500">
      <rect width="1200" height="1500" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Cup-warmer gallery -->
  <g fill="url(#steelV)">
    <rect x="210" y="118" width="780" height="12" rx="6"/>
    <rect x="226" y="124" width="12" height="80" rx="6"/>
    <rect x="962" y="124" width="12" height="80" rx="6"/>
    <rect x="594" y="124" width="12" height="80" rx="6"/>
  </g>

  <g mask="url(#bodyFade)">
    <!-- Body: matte black side panels -->
    <path d="M190 250a40 40 0 0 1 40-40h740a40 40 0 0 1 40 40v1250H190Z" fill="url(#matte)"/>
    <!-- Polished front panel -->
    <path d="M340 236h520v1264H340Z" fill="url(#steel)"/>
    <path d="M340 236h520v14H340Z" fill="#fff8ec" opacity=".55"/>
    <!-- Panel seams -->
    <path d="M340 236v1264M860 236v1264" stroke="#140d0b" stroke-width="4" opacity=".6"/>
  </g>

  <!-- Cup tray (top) -->
  <rect x="168" y="196" width="864" height="44" rx="10" fill="url(#steel)"/>
  <rect x="168" y="196" width="864" height="8" rx="4" fill="#fffaf0" opacity=".7"/>

  <!-- Pressure gauge (no text) -->
  <circle cx="600" cy="370" r="70" fill="url(#steelV)"/>
  <circle cx="600" cy="370" r="56" fill="url(#gauge)"/>
  <g stroke="#2a1d19" stroke-width="3" stroke-linecap="round">
    <path d="M558 400l8-6M552 370h10M558 340l8 6M600 322v10M642 340l-8 6M648 370h-10M642 400l-8-6"/>
  </g>
  <path d="M600 370l30-26" stroke="#7c2b22" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="370" r="7" fill="#2a1d19"/>

  <!-- Controls -->
  <g>
    <rect x="912" y="300" width="52" height="30" rx="8" fill="url(#steelV)"/>
    <rect x="912" y="350" width="52" height="30" rx="8" fill="url(#steelV)"/>
    <rect x="912" y="400" width="52" height="30" rx="8" fill="url(#steelV)"/>
  </g>

  <!-- Steam wand (left) -->
  <circle cx="262" cy="520" r="30" fill="url(#steelV)"/>
  <path d="M262 548v150c0 60-12 120-30 190" fill="none" stroke="url(#steelV)" stroke-width="16" stroke-linecap="round"/>
  <!-- Hot-water knob (right) -->
  <circle cx="938" cy="520" r="30" fill="url(#steelV)"/>

  <!-- Group head -->
  <rect x="462" y="540" width="276" height="40" rx="12" fill="url(#steel)"/>
  <rect x="488" y="576" width="224" height="118" rx="26" fill="url(#steel)"/>
  <rect x="488" y="576" width="224" height="10" rx="5" fill="#fffaf0" opacity=".5"/>

  <!-- Portafilter handle (to the right, toward the viewer) -->
  <path d="M700 724L998 812" stroke="url(#handle)" stroke-width="50" stroke-linecap="round"/>
  <path d="M708 716L990 800" stroke="#5b4842" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <rect x="680" y="702" width="56" height="44" rx="12" fill="url(#steelV)"/>

  <!-- Basket with ears -->
  <path d="M486 694h228l-18 70H504Z" fill="url(#steel)"/>
  <rect x="470" y="694" width="260" height="16" rx="8" fill="url(#steelV)"/>

  <!-- Single spout: tapers to the tip at (600, 870) -->
  <path d="M554 764h92l-22 70h-48Z" fill="url(#steel)"/>
  <path d="M578 832h44l-6 38h-32Z" fill="url(#steelV)"/>
  <path d="M580 832h8l-2 38h-4Z" fill="#fffaf0" opacity=".6"/>
</svg>
